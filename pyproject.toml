[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luciole"
dynamic = ["version"]
description = "Explore Python codebases as an interactive graph that lights up as your code runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Suescun" }]
requires-python = ">=3.10"
keywords = ["visualization", "call-graph", "data-flow", "code-exploration", "vscode"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Pinepomme/luciole"
Repository = "https://github.com/Pinepomme/luciole"
Issues = "https://github.com/Pinepomme/luciole/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.version]
path = "src/luciole/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/luciole"]